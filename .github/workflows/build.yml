name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make ayah list
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('app/src/main/assets/quran.json'))
          with open('list.txt','w') as f:
              for s in d:
                  for a in s['ayahs']:
                      f.write("%03d%03d\n"%(s['n'],a['a']))
          PY
      - name: Download + compress Yasser Ad-Dossary
        run: |
          mkdir -p raw app/src/main/assets/audio/dossary
          cat list.txt | xargs -P 6 -I{} sh -c 'for i in 1 2 3 4; do curl -fsSL -A "Mozilla/5.0" -o raw/{}.mp3 "https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/{}.mp3" && break; sleep 3; done'
          ls raw | xargs -P 4 -I{} sh -c 'ffmpeg -loglevel error -y -i raw/{} -ac 1 -ar 22050 -b:a 32k -codec:a libmp3lame app/src/main/assets/audio/dossary/{}'
          echo "dossary: $(ls app/src/main/assets/audio/dossary | wc -l) files"; du -sh app/src/main/assets/audio/dossary; rm -rf raw
      - name: Download + compress Al-Minshawi
        run: |
          mkdir -p raw app/src/main/assets/audio/minshawi
          cat list.txt | xargs -P 6 -I{} sh -c 'for i in 1 2 3 4; do curl -fsSL -A "Mozilla/5.0" -o raw/{}.mp3 "https://everyayah.com/data/Minshawy_Murattal_128kbps/{}.mp3" && break; sleep 3; done'
          ls raw | xargs -P 4 -I{} sh -c 'ffmpeg -loglevel error -y -i raw/{} -ac 1 -ar 22050 -b:a 32k -codec:a libmp3lame app/src/main/assets/audio/minshawi/{}'
          echo "minshawi: $(ls app/src/main/assets/audio/minshawi | wc -l) files"; du -sh app/src/main/assets/audio/minshawi; rm -rf raw
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MohammedYahyaQuran-apk, path: app/build/outputs/apk/debug/app-debug.apk }
